name: Deploy IECCalc API Worker

# Manual only. DO NOT put a push trigger back.
# _lib/worker.js in git is not the live worker: the live one is deployed by
# hand from _v2_staging/redesign/engineers_apps. On 2026-09-23 the push trigger
# deployed the stale git copy, which crashes on every route but /health
# ("Cannot access 'm' before initialization"), so nobody could sign in.
# It was rolled back to version 2a6867ca (2026-09-17).
on:
  workflow_dispatch:

concurrency:
  group: ieccalc-api-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_PAGES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e5d02013758955380085433a5a0b24ed
          command: deploy

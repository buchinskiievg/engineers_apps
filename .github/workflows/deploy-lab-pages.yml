name: Deploy IECCalc LAB to Cloudflare Pages

# Manual only. DO NOT put a push trigger back.
# This job deploys the WHOLE git tree to the production Pages project, and the
# git tree is not the site: the live site is deployed by hand from
# _v2_staging/redesign/engineers_apps. On 2026-09-23 the push trigger replaced
# the whole site with the stale git tree (design.css metal10 instead of metal36),
# which broke the header, the home page and the admin, until it was redeployed
# from the redesign folder.
on:
  workflow_dispatch:

concurrency:
  group: ieccalc-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LibreDWG browser runtime
        shell: bash
        run: |
          npm install --no-save @mlightcad/libredwg-web@0.7.14
          WASM_FILE="$(find node_modules/@mlightcad/libredwg-web -type f -name 'libredwg-web.wasm' | head -n 1)"
          if [ -z "$WASM_FILE" ]; then
            echo "libredwg-web.wasm not found in npm package"
            find node_modules/@mlightcad/libredwg-web -maxdepth 3 -type f | sort
            exit 1
          fi
          cp "$WASM_FILE" lab/document-studio/libredwg-web.wasm
          ls -lh lab/document-studio/libredwg-web.wasm

      - name: Deploy site to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_PAGES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e5d02013758955380085433a5a0b24ed
          command: pages deploy . --project-name=engineers-apps --branch=main

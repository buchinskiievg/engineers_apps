<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Content &mdash; IECCalc.com</title>
<meta name="description" content="Engineering content portal: featured articles, videos, presentations, posts." />
<link rel="stylesheet" href="/_lib/design.css?v=metal10" />
<link rel="stylesheet" href="/_lib/mobile.css" />
<style>
  html, body { height: 100%; } body { background: var(--paper); }

  /* Filter chips strip */
  .cn-filters { display: flex; gap: 6px; padding: 12px 32px; background: var(--carbon); align-items: center; overflow-x: auto; }
  .cn-filter { font: 800 11px/1 var(--sans); letter-spacing: 0.12em; text-transform: uppercase; padding: 7px 13px; border: 1px solid rgba(255,255,255,0.18); background: transparent; color: rgba(255,255,255,0.7); cursor: pointer; }
  .cn-filter:hover { color: #fff; border-color: rgba(255,255,255,0.4); }
  .cn-filter.is-on { color: #fff; background: var(--red); border-color: var(--red); }
  @media (max-width:760px) { .cn-filters { padding: 10px 16px; } }

  /* Compose collapsible (admin) */
  .compose-bar { max-width: 1280px; margin: 14px auto 0; padding: 0 32px; }
  @media (max-width:760px) { .compose-bar { padding: 0 16px; } }
  .compose-toggle { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 16px; background: var(--ink); color: var(--paper); border: 0; cursor: pointer; font: 800 12px/1 var(--sans); letter-spacing: 0.14em; text-transform: uppercase; }
  .compose-toggle:hover { background: var(--carbon); }
  .compose-toggle .plus { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; background: var(--red); color: #fff; font: 900 15px/1 var(--display); transition: transform .2s; }
  .compose-toggle.is-open .plus { transform: rotate(45deg); }
  .compose-toggle .sub { font: 600 10.5px/1 var(--sans); color: rgba(255,255,255,0.5); margin-left: auto; text-transform: none; }
  .composer { background: var(--paper-2); border: 2px solid var(--ink); border-top: 0; max-height: 0; overflow: hidden; opacity: 0; transition: max-height .25s, opacity .15s, padding .25s; padding: 0 16px; }
  .composer.is-open { max-height: 1200px; opacity: 1; padding: 14px 16px; }
  .composer-tabs { display: flex; gap: 4px; margin-bottom: 10px; overflow-x: auto; }
  .composer-tab { font: 800 11px/1 var(--sans); letter-spacing: 0.10em; padding: 7px 13px; border: 1px solid var(--border); background: var(--paper); color: var(--ink-2); cursor: pointer; text-transform: uppercase; flex-shrink: 0; }
  .composer-tab.is-on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .composer-fields { display: flex; flex-direction: column; gap: 7px; }
  .composer-fields input, .composer-fields textarea, .composer-fields select { width: 100%; font: 500 14px/1.4 var(--sans); padding: 8px 11px; border: 1px solid var(--border); background: var(--paper); }
  .composer-fields textarea { min-height: 110px; resize: vertical; font-family: var(--sans); }
  .composer-fields textarea.short { min-height: 70px; }
  .composer-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .composer-row > * { flex: 1; min-width: 160px; }
  .composer-actions { display: flex; gap: 10px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .composer-msg { font: 600 12px/1.4 var(--sans); }
  .composer-msg.ok  { color: var(--green); }
  .composer-msg.err { color: var(--red); }
  .composer-help { font: 500 11px/1.4 var(--sans); color: var(--ink-3); }
  .composer-help code { background: var(--surface); padding: 1px 4px; font-family: "Consolas",monospace; font-size: 11px; }
  .composer-preview { background: var(--surface); border: 1px dashed var(--border); padding: 10px 12px; margin-top: 6px; font: 500 13px/1.5 var(--sans); white-space: pre-wrap; word-break: break-word; min-height: 24px; }

  /* ── Magazine layout ─────────────────────────────────────────────── */
  .mag { max-width: 1280px; margin: 0 auto; padding: 20px 32px 60px; }
  @media (max-width: 760px) { .mag { padding: 14px 16px 40px; } }

  /* Top: featured + right rail */
  .mag-hero {
    display: grid;
    grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr);
    gap: 22px;
    margin-bottom: 36px;
    border-top: 2px solid var(--ink);
    border-bottom: 2px solid var(--ink);
    padding: 18px 0;
  }
  @media (max-width: 900px) { .mag-hero { grid-template-columns: 1fr; gap: 18px; } }

  /* Featured article (left) */
  .mag-feat { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .mag-feat .cover {
    aspect-ratio: 16 / 9;
    background: var(--carbon) center/cover;
    border: 1px solid var(--border);
  }
  .mag-feat .cover-empty {
    background: linear-gradient(135deg, var(--ink-2), var(--carbon));
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.4);
    font: 900 56px/1 var(--display);
  }
  .mag-feat .eyebrow {
    font: 800 11px/1 var(--sans);
    letter-spacing: 0.18em;
    color: var(--red);
    text-transform: uppercase;
  }
  .mag-feat h2 {
    font: 900 32px/1.08 var(--display);
    letter-spacing: -0.025em;
    margin: 4px 0 6px;
    color: var(--ink);
  }
  .mag-feat h2 a { color: inherit; text-decoration: none; }
  .mag-feat h2 a:hover { color: var(--red); }
  .mag-feat .lede {
    font: 500 15px/1.55 var(--sans);
    color: var(--ink-2);
    margin: 0;
  }
  .mag-feat .meta {
    font: 600 11px/1 var(--sans);
    letter-spacing: 0.10em;
    color: var(--ink-3);
    text-transform: uppercase;
    margin-top: 8px;
  }

  /* Right rail */
  .mag-rail {
    display: flex; flex-direction: column; gap: 22px;
    border-left: 1px solid var(--line);
    padding-left: 22px;
    min-width: 0;
  }
  @media (max-width: 900px) { .mag-rail { border-left: 0; border-top: 1px solid var(--line); padding-left: 0; padding-top: 18px; } }
  .mag-rail-h {
    font: 900 13px/1 var(--sans);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink);
    border-bottom: 2px solid var(--ink);
    padding-bottom: 7px;
    margin-bottom: 8px;
  }
  .mag-rail-h .num { color: var(--red); font-family: var(--display); font-weight: 900; }
  .mag-post {
    display: block;
    text-decoration: none; color: var(--ink);
    padding: 9px 0;
    border-bottom: 1px solid var(--line-soft);
  }
  .mag-post:last-child { border-bottom: 0; }
  .mag-post:hover { color: var(--red); }
  .mag-post .body {
    font: 500 13px/1.4 var(--sans);
    margin: 0;
    /* Clip to 3 lines */
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .mag-post .meta {
    font: 600 10px/1 var(--sans);
    letter-spacing: 0.12em;
    color: var(--ink-3);
    text-transform: uppercase;
    margin-top: 6px;
  }

  /* Section header */
  .mag-sec {
    margin-top: 40px;
    border-top: 1px solid var(--line);
    padding-top: 16px;
  }
  .mag-sec.first { margin-top: 0; border-top: 0; padding-top: 0; }
  .mag-sec-h {
    display: flex; align-items: baseline; gap: 14px;
    margin-bottom: 16px;
  }
  .mag-sec-h .num {
    font: 900 22px/1 var(--display);
    color: var(--red);
    letter-spacing: -0.02em;
  }
  .mag-sec-h .label {
    font: 900 18px/1 var(--display);
    letter-spacing: -0.005em;
    text-transform: uppercase;
  }
  .mag-sec-h .count {
    font: 700 11px/1 var(--sans);
    letter-spacing: 0.14em;
    color: var(--ink-3);
    text-transform: uppercase;
    margin-left: auto;
  }
  .mag-sec-h .rule {
    flex: 1; height: 2px; background: var(--ink);
    align-self: end; margin-bottom: 3px;
  }

  /* Grid for cards */
  .mag-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .mag-grid.cols2 { grid-template-columns: repeat(2, 1fr); }
  .mag-grid.cols4 { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 900px) { .mag-grid, .mag-grid.cols2, .mag-grid.cols4 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 560px) { .mag-grid, .mag-grid.cols2, .mag-grid.cols4 { grid-template-columns: 1fr; } }

  .mag-card {
    background: var(--surface);
    border: 1px solid var(--border);
    text-decoration: none;
    color: inherit;
    display: flex; flex-direction: column;
    transition: border-color .12s;
  }
  .mag-card:hover { border-color: var(--ink); }
  .mag-card .cover {
    aspect-ratio: 16 / 9;
    background: var(--ink-2) center/cover;
  }
  .mag-card .cover-empty {
    background: linear-gradient(135deg, var(--ink-2), var(--carbon));
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.35);
    font: 900 32px/1 var(--display);
  }
  .mag-card .meta {
    display: flex; gap: 8px; align-items: center;
    padding: 10px 14px 4px;
    font: 700 10px/1 var(--sans);
    letter-spacing: 0.12em;
    color: var(--ink-3);
    text-transform: uppercase;
  }
  .mag-card .type {
    padding: 2px 6px; background: var(--ink); color: #fff;
    font-size: 9.5px; letter-spacing: 0.14em;
  }
  .mag-card .type.video { background: var(--red); }
  .mag-card .type.presentation { background: #1a3a6a; }
  .mag-card .type.post { background: var(--green); }
  .mag-card h4 {
    font: 800 15px/1.2 var(--display);
    letter-spacing: -0.005em;
    padding: 2px 14px 6px;
    margin: 0;
  }
  .mag-card .excerpt {
    font: 500 12.5px/1.45 var(--sans);
    color: var(--ink-2);
    padding: 0 14px 12px;
    flex: 1;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .mag-card .foot {
    padding: 8px 14px 12px;
    border-top: 1px dashed var(--line);
    font: 600 10.5px/1 var(--sans);
    color: var(--ink-3);
    display: flex; justify-content: space-between;
  }

  /* Wide post card (for posts section — text-heavy, no big cover) */
  .mag-post-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--green);
    padding: 14px 16px;
    text-decoration: none;
    color: var(--ink);
    display: flex; flex-direction: column; gap: 6px;
  }
  .mag-post-card:hover { border-left-color: var(--red); }
  .mag-post-card .meta {
    font: 700 10px/1 var(--sans);
    letter-spacing: 0.14em;
    color: var(--ink-3);
    text-transform: uppercase;
  }
  .mag-post-card .body {
    font: 500 14px/1.5 var(--sans);
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* Empty section placeholder */
  .mag-empty {
    grid-column: 1 / -1;
    padding: 30px 24px;
    background: rgba(0,0,0,0.02);
    border: 2px dashed var(--border-strong);
    text-align: center;
    color: var(--ink-3);
    font: 500 13px/1.5 var(--sans);
  }
  .mag-empty .hint { font-size: 11px; color: var(--ink-4); margin-top: 4px; }
</style>
</head>
<body>

<!-- Compose collapsed bar (admin) -->
<div class="compose-bar hidden" id="compose-wrap">
  <button class="compose-toggle" id="compose-toggle" type="button">
    <span class="plus">+</span>

  <div class="composer" id="composer">
    <div class="composer-tabs" id="composer-tabs">

      <div class="composer-help">Quick thought, link, or short observation. <code>**bold**</code> · <code>*italic*</code> · <code>[link](url)</code></div>

      <input type="text" id="a-slug" placeholder="URL slug (auto from title)" />

    <div class="composer-preview hidden" id="composer-preview"></div>
    <div class="composer-actions">
      <button class="btn btn-primary" id="btn-publish">PUBLISH</button>

</div>

<div class="cn-filters" id="cn-filters">
  <button class="cn-filter is-on" data-type="all">All</button>
  <button class="cn-filter" data-type="article">Articles</button>
  <button class="cn-filter" data-type="post">Posts</button>
  <button class="cn-filter" data-type="video">Videos</button>
  <button class="cn-filter" data-type="presentation">Presentations</button>

<main class="mag" id="mag">
  <!-- Hero: featured + rail -->
  <section class="mag-hero" id="mag-hero" style="display:none">
    <article class="mag-feat" id="featured"></article>
    <aside class="mag-rail" id="rail">
      <div>
        <h3 class="mag-rail-h"><span class="num">/</span> LATEST POSTS</h3>
        <div id="rail-posts"></div>
      </div>

  <!-- Article section -->
  <section class="mag-sec first" id="sec-article" data-type="article">
    <header class="mag-sec-h">
      <span class="num">01</span>
      <span class="label">Articles</span>
      <span class="rule"></span>
      <span class="count" id="cnt-article">0 entries</span>
    </header>
    <div class="mag-grid" id="body-article"></div>
  </section>

  <!-- Video section -->
  <section class="mag-sec" id="sec-video" data-type="video">
    <header class="mag-sec-h">
      <span class="num">02</span>
      <span class="label">Videos</span>
      <span class="rule"></span>
      <span class="count" id="cnt-video">0 entries</span>
    </header>
    <div class="mag-grid cols2" id="body-video"></div>
  </section>

  <!-- Presentations section -->
  <section class="mag-sec" id="sec-presentation" data-type="presentation">
    <header class="mag-sec-h">
      <span class="num">03</span>
      <span class="label">Presentations</span>
      <span class="rule"></span>
      <span class="count" id="cnt-presentation">0 entries</span>

  <section class="mag-sec" id="sec-post" data-type="post">

      <span class="num">04</span>
      <span class="label">Posts</span>
      <span class="rule"></span>

<script src="/_lib/api.js?v=projects2"></script>

<script src="/_lib/auth-ui.js"></script>
<script>
(function() {
  'use strict';
  function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
  function fmtDate(t){return t ? new Date(t).toISOString().slice(0,10) : '';}
  function slugify(s){return String(s||'').toLowerCase().replace(/[^a-z0-9\s-]/g,'').trim().replace(/\s+/g,'-').slice(0,80);}
  function md(src){
    if(!src) return '';
    let h = esc(src);
    h = h.replace(/^### (.+)$/gm, '<h3>$1</h3>').replace(/^## (.+)$/gm, '<h2>$1</h2>');
    h = h.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(?<!\*)\*([^*\n]+)\*/g, '<i>$1</i>');
    h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
    h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
    h = h.split(/\n\n+/).map(p => p.trim().startsWith('<') ? p : '<p>'+p.replace(/\n/g,'<br>')+'</p>').join('\n');
    return h;
  }

  // Cards
  function magCard(item) {
    const t = item.type;
    let href;
    if (t === 'article')      href = '/content/articles/' + esc(item.key);
    else if (t === 'video')   href = '/content/v/' + esc(item.key);
    else if (t === 'presentation') href = '/content/p/' + esc(item.key);
    else                      href = '/content/posts/' + esc(item.key);
    if (t === 'post') {
      // Wide post card
      return `<a class="mag-post-card" href="${href}">
        <span class="meta">POST &middot; ${fmtDate(item.published_at)}</span>
        <div class="body">${esc((item.preview||'').slice(0, 300))}</div>
      </a>`;
    }
    const cover = item.cover
      ? `<div class="cover" style="background-image:url('${esc(item.cover)}')"></div>`
      : `<div class="cover cover-empty">${t.charAt(0).toUpperCase()}</div>`;
    return `<a class="mag-card" href="${href}">
      ${cover}
      <div class="meta"><span class="type ${t}">${t}</span><span>${fmtDate(item.published_at)}</span></div>
      ${item.title ? `<h4>${esc(item.title)}</h4>` : ''}
      <div class="excerpt">${esc((item.preview || '').slice(0,160))}</div>
      <div class="foot"><span>0 comments</span><span>OPEN &rarr;</span></div>
    </a>`;
  }

  function railPost(item) {
    let href = '/content/posts/' + esc(item.key);
    return `<a class="mag-post" href="${href}">
      <p class="body">${esc((item.preview||'').slice(0,220))}</p>
      <div class="meta">${fmtDate(item.published_at)}</div>
    </a>`;
  }

  // Render featured (first article OR first non-post item)
  function renderFeatured(item) {
    if (!item) { document.getElementById('mag-hero').style.display = 'none'; return; }
    document.getElementById('mag-hero').style.display = '';
    const href = item.type === 'article' ? '/content/articles/' + esc(item.key)
                : item.type === 'video' ? '/content/v/' + esc(item.key)
                : item.type === 'presentation' ? '/content/p/' + esc(item.key)
                : '/content/posts/' + esc(item.key);
    const cover = item.cover
      ? `<div class="cover" style="background-image:url('${esc(item.cover)}')"></div>`
      : `<div class="cover cover-empty">${item.type.charAt(0).toUpperCase()}</div>`;
    document.getElementById('featured').innerHTML = `
      ${cover}
      <span class="eyebrow">FEATURED &middot; ${esc(item.type).toUpperCase()}</span>
      <h2><a href="${href}">${esc(item.title || (item.preview||'').slice(0,80))}</a></h2>
      ${item.preview ? `<p class="lede">${esc(item.preview.slice(0, 240))}</p>` : ''}
      <div class="meta">${fmtDate(item.published_at)} &middot; READ MORE &rarr;</div>
    `;
  }

  let allFeed = [];
  function render(filter) {
    const types = ['article','video','presentation','post'];

    // Pick featured: first article, or first item
    if (filter === 'all') {
      const featured = allFeed.find(x => x.type === 'article') || allFeed[0];
      // Display feed minus featured
      const rest = featured ? allFeed.filter(x => !(x.type===featured.type && x.key===featured.key)) : allFeed;
      renderFeatured(featured);

      // Right rail = latest posts
      const railPosts = allFeed.filter(x => x.type === 'post').slice(0, 5);
      const railRoot = document.getElementById('rail-posts');
      railRoot.innerHTML = railPosts.length
        ? railPosts.map(railPost).join('')
        : '<div style="padding:10px 0;color:var(--ink-3);font-size:12px">No posts yet — short LinkedIn-style messages will appear here.</div>';

      // Sections (excluding featured)
      for (const t of types) {
        const items = rest.filter(x => x.type === t);
        const body = document.getElementById('body-'+t);
        const count = document.getElementById('cnt-'+t);
        const sec = document.getElementById('sec-'+t);
        count.textContent = items.length + ' ' + (items.length === 1 ? 'entry' : 'entries');
        if (items.length) {
          body.innerHTML = items.slice(0, 6).map(magCard).join('');
        } else {
          body.innerHTML = `<div class="mag-empty">No <b>${t}s</b> yet.<div class="hint">${sectionHint(t)}</div></div>`;
        }
        sec.style.display = '';
      }
    } else {
      // Single-type filter — show only that section
      document.getElementById('mag-hero').style.display = 'none';
      for (const t of types) {
        const sec = document.getElementById('sec-'+t);
        sec.style.display = (t === filter) ? '' : 'none';
        const items = allFeed.filter(x => x.type === t);
        const body = document.getElementById('body-'+t);
        const count = document.getElementById('cnt-'+t);
        count.textContent = items.length + ' ' + (items.length === 1 ? 'entry' : 'entries');
        body.innerHTML = items.length
          ? items.map(magCard).join('')
          : `<div class="mag-empty">No <b>${t}s</b> yet.<div class="hint">${sectionHint(t)}</div></div>`;
      }
    }
  }

  function sectionHint(t) {
    return {
      article: 'Longform writeups with full markdown, code blocks, embedded images.',
      video: 'YouTube embeds, MP4 uploads or any embed HTML.',
      presentation: 'LinkedIn-style image carousels with captions per slide.',
      post: 'Short LinkedIn-style messages, up to 600 characters with optional image.',
    }[t] || '';
  }

  document.getElementById('cn-filters').addEventListener('click', e => {
    const b = e.target.closest('.cn-filter'); if (!b) return;
    document.querySelectorAll('.cn-filter').forEach(x => x.classList.remove('is-on'));
    b.classList.add('is-on');
    render(b.dataset.type);
  });

  function loadFeed() {
    IecApi.contentFeed(60).then(d => { allFeed = d.feed || []; render(document.querySelector('.cn-filter.is-on').dataset.type); })
      .catch(e => { document.getElementById('mag').innerHTML = '<div class="mag-empty">Content offline ('+esc(e.message)+').</div>'; });
  }
  loadFeed();

  // ── COMPOSER ──────────────────────────────────────────────────
  const toggle = document.getElementById('compose-toggle');
  const composer = document.getElementById('composer');
  toggle.addEventListener('click', () => {
    toggle.classList.toggle('is-open');
    composer.classList.toggle('is-open');
  });
  let currentKind = 'post';
  function setKind(k) {
    currentKind = k;
    document.querySelectorAll('.composer-tab').forEach(t => t.classList.toggle('is-on', t.dataset.kind === k));
    document.querySelectorAll('.composer-fields').forEach(f => f.classList.toggle('hidden', f.dataset.form !== k));
    document.getElementById('composer-preview').classList.add('hidden');
    document.getElementById('compose-sub').textContent = 'composing: ' + k;
  }
  document.getElementById('composer-tabs').addEventListener('click', e => {
    const b = e.target.closest('.composer-tab'); if (!b) return;
    setKind(b.dataset.kind);
  });
  document.getElementById('v-id').addEventListener('blur', () => {
    const id = document.getElementById('v-id').value.trim();
    if (id && !document.getElementById('v-cover').value) {
      document.getElementById('v-cover').value = 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg';
    }
  });

  function collectPayload(kind, publish) {
    const tags = id => { const v = document.getElementById(id).value.trim(); return v ? JSON.stringify(v.split(',').map(s=>s.trim()).filter(Boolean)) : null; };
    if (kind === 'post') {
      return { author_id: window.__iec_session?.user?.id || 1,
        body_md: document.getElementById('p-body').value.trim(),
        image_url: document.getElementById('p-image').value.trim() || null,
        tags_json: tags('p-tags'), publish };
    }
    if (kind === 'article') {
      const title = document.getElementById('a-title').value.trim();
      return { slug: document.getElementById('a-slug').value.trim() || slugify(title),
        title, excerpt: document.getElementById('a-excerpt').value.trim(),
        cover_image: document.getElementById('a-cover').value.trim() || null,
        body_md: document.getElementById('a-body').value.trim(),
        tags_json: tags('a-tags'), publish };
    }
    if (kind === 'video') {
      const title = document.getElementById('v-title').value.trim();
      return { slug: document.getElementById('v-slug').value.trim() || slugify(title),
        title, description: document.getElementById('v-desc').value.trim(),
        source: document.getElementById('v-source').value,
        youtube_id: document.getElementById('v-source').value === 'youtube' ? document.getElementById('v-id').value.trim() : null,
        cover_url: document.getElementById('v-cover').value.trim() || null,
        tags_json: tags('v-tags'), publish };
    }
    if (kind === 'presentation') {
      const title = document.getElementById('pr-title').value.trim();
      return { slug: document.getElementById('pr-slug').value.trim() || slugify(title),
        title, description: document.getElementById('pr-desc').value.trim(),
        cover_url: document.getElementById('pr-cover').value.trim() || null,
        tags_json: tags('pr-tags'),
        _slides: document.getElementById('pr-slides').value.split('\n').map(l=>l.trim()).filter(Boolean).map((l,i)=>{ const [u,...r]=l.split('|'); return {idx:i,image_url:u.trim(),caption:r.join('|').trim()||null}; }),
        publish };
    }
  }
  async function submit(publish) {
    const msg = document.getElementById('composer-msg');
    const payload = collectPayload(currentKind, publish);
    msg.textContent = publish ? 'Publishing…' : 'Saving draft…'; msg.className = 'composer-msg';
    const tbl = { post:'posts', article:'articles', video:'videos', presentation:'presentations' }[currentKind];
    try {
      const slides = payload._slides; delete payload._slides;
      const r = await fetch(IecApi.base + '/admin/' + tbl, { method:'POST', credentials:'include', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'failed');
      if (currentKind === 'presentation' && slides) {
        for (const s of slides) {
          await fetch(IecApi.base + '/admin/presentation-slides', { method:'POST', credentials:'include', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ presentation_id: data.id, ...s }) });
        }
      }
      msg.textContent = publish ? 'Published! Reloading…' : 'Draft saved.'; msg.className = 'composer-msg ok';
      document.querySelectorAll('.composer-fields input, .composer-fields textarea').forEach(el => el.value = '');
      setTimeout(() => { msg.textContent = ''; loadFeed(); toggle.classList.remove('is-open'); composer.classList.remove('is-open'); }, 1200);
    } catch (e) { msg.textContent = 'Failed: ' + e.message; msg.className = 'composer-msg err'; }
  }
  document.getElementById('btn-publish').addEventListener('click', () => submit(true));
  document.getElementById('btn-draft').addEventListener('click', () => submit(false));
  document.getElementById('btn-preview').addEventListener('click', () => {
    const pv = document.getElementById('composer-preview');
    const p = collectPayload(currentKind, false);
    pv.innerHTML = (p.cover_image ? `<img src="${esc(p.cover_image)}" style="max-width:100%"><br>` : (p.cover_url ? `<img src="${esc(p.cover_url)}" style="max-width:100%"><br>` : ''))
                 + (p.title ? `<h3>${esc(p.title)}</h3>` : '')
                 + md(p.body_md || p.description || '');
    pv.classList.remove('hidden');
  });

  IecApi.me().then(s => {
    if (s.authenticated && s.isAdmin) document.getElementById('compose-wrap').classList.remove('hidden');
  }).catch(()=>{});
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Forum &mdash; IECCalc.com</title>
<meta name="description" content="Engineering forum — cables, faults, grounding, transformers, motors, power quality, standards." />
<link rel="stylesheet" href="/_lib/design.css?v=metal10" />
<link rel="stylesheet" href="/_lib/mobile.css" />
<style>
  html, body { height: 100%; } body { background: var(--paper); }
  .fr-head { background: var(--paper); border-bottom: 2px solid var(--ink); padding: 26px 48px 20px; max-width: 1440px; margin: 0 auto; display: flex; justify-content: space-between; align-items: end; gap: 20px; }
  .fr-head h1 { font: 900 36px/1 var(--display); letter-spacing: -0.03em; margin: 0; text-transform: uppercase; }
  .fr-head p { font: 500 13.5px/1.5 var(--sans); color: var(--ink-2); margin: 8px 0 0; max-width: 660px; }
  .fr-cats { max-width: 1280px; margin: 0 auto; padding: 28px 48px 60px; }
  @media (max-width:760px) { .fr-cats, .fr-head { padding-left: 18px; padding-right: 18px; } }
  .fr-cat { display: grid; grid-template-columns: 56px 1fr auto auto; gap: 18px; align-items: center; padding: 18px 22px; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--ink); text-decoration: none; color: var(--ink); margin-bottom: 10px; transition: border-left-color .12s, background .12s; }
  .fr-cat:hover { background: #f0ede4; border-left-color: var(--red); }
  .fr-cat .icn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: var(--ink); color: var(--red); }
  .fr-cat .body h3 { margin: 0 0 4px; font: 900 17px/1.1 var(--display); letter-spacing: -0.01em; text-transform: uppercase; }
  .fr-cat .body p { margin: 0; font: 500 12.5px/1.4 var(--sans); color: var(--ink-3); }
  .fr-cat .stat { text-align: right; }
  .fr-cat .stat-k { font: 900 22px/1 var(--display); color: var(--red); display: block; }
  .fr-cat .stat-u { font: 800 9px/1 var(--sans); letter-spacing: 0.14em; color: var(--ink-3); margin-top: 3px; display: block; }
  .empty { padding: 50px 24px; text-align: center; color: var(--ink-3); background: var(--surface); border: 1px dashed var(--border); }
</style>
</head>
<body>
<div class="ab v-a">

<header class="va-nav va-nav-xl">
  <a href="/" class="logo-nav logo-nav-xl" aria-label="IECCalc.com">
    <span class="logo-nav-mark" style="width:48px;height:48px">
      <svg width="48" height="48" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="1" y="1" width="62" height="62" rx="3" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <line x1="32" y1="32" x2="32" y2="10" stroke="var(--ink)" stroke-width="3.5"/>
        <line x1="32" y1="32" x2="51.05" y2="43" stroke="var(--red)" stroke-width="3.5"/>
        <line x1="32" y1="32" x2="12.95" y2="43" stroke="var(--ink)" stroke-width="3.5"/>
        <circle cx="32" cy="10" r="3" fill="var(--ink)"/><circle cx="51.05" cy="43" r="3" fill="var(--red)"/>
        <circle cx="12.95" cy="43" r="3" fill="var(--ink)"/><circle cx="32" cy="32" r="4" fill="var(--ink)"/>
      </svg>
    </span>
    <span class="logo-nav-stack">
      <span class="logo-nav-word logo-nav-word-xl" style="font-size:26px"><b style="color:var(--ink)">IEC</b><b style="color:var(--red)">CALC</b><span class="logo-nav-tld" style="color:var(--ink-3)">.COM</span></span>
      <span class="logo-nav-tag">&mdash; POWER ENGINEERING TOOLBOX &mdash;</span>
    </span>
  </a>
  <nav>
    <a href="/#tabs">TOOLBOX</a>
    <a href="/content/">CONTENT</a>
    <a href="/forum/" class="is-on">FORUM</a>
    <a href="/#pricing">PRICING</a>
  </nav>
  <div class="va-nav-r">
    <a href="/account/?intent=signin" class="va-sign">SIGN IN</a>
    <a href="/account/" class="btn btn-primary btn-sm">SUBSCRIBE</a>
  </div>
</header>

<div class="fr-head">
  <div>
    <h1>Forum</h1>
    <p>Eight categories of engineering discussion. Sign in to start threads and reply. Markdown supported.</p>
  </div>
  <a href="/account/?intent=signin" class="btn btn-primary">START A THREAD</a>
</div>

<main class="fr-cats" id="fr-cats">
  <div class="empty">Loading&hellip;</div>
</main>

</div>
<script src="/_lib/api.js"></script>
<script>
(function() {
  'use strict';
  function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
  const ICONS = {
    bolt: '<path d="M13 2 L4 14 H11 L9 22 L20 9 H13 L15 2 Z" fill="currentColor" stroke="none"/>',
    cable: '<path fill="none" stroke="currentColor" stroke-width="2" d="M3 9 q 4.5 -6 9 0 t 9 0"/><path fill="none" stroke="currentColor" stroke-width="2" d="M3 16 q 4.5 -6 9 0 t 9 0"/>',
    earth: '<path fill="none" stroke="currentColor" stroke-width="2" d="M12 2 V14 M5 14 H19 M7 17 H17 M9 20 H15"/>',
    tx: '<circle cx="9" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="15" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/>',
    motor: '<circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" d="M9 9 L15 15 M15 9 L9 15"/>',
    cap: '<path fill="none" stroke="currentColor" stroke-width="2" d="M3 12 H10 M14 12 H21 M10 5 V19 M14 5 V19"/>',
    doc: '<path fill="none" stroke="currentColor" stroke-width="2" d="M5 3 H14 L19 8 V21 H5 Z M14 3 V8 H19 M8 12 H16 M8 15 H16 M8 18 H13"/>',
    book: '<path fill="none" stroke="currentColor" stroke-width="2" d="M3 3 H11 a 2 2 0 0 1 2 2 V21 a 2 2 0 0 0 -2 -2 H3 Z M21 3 H13 a 2 2 0 0 0 -2 2 V21 a 2 2 0 0 1 2 -2 H21 Z"/>',
  };
  function icon(k) {
    return '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[k] || ICONS.book) + '</svg>';
  }
  IecApi.forumCategories().then(d => {
    const cats = d.categories || [];
    const root = document.getElementById('fr-cats');
    root.innerHTML = cats.length
      ? cats.map(c => `<a href="/forum/c/${esc(c.slug)}" class="fr-cat">
          <span class="icn">${icon(c.icon)}</span>
          <div class="body">
            <h3>${esc(c.name)}</h3>
            <p>${esc(c.description || '')}</p>
          </div>
          <div class="stat">
            <span class="stat-k">${c.thread_count || 0}</span>
            <span class="stat-u">THREADS</span>
          </div>
          <span style="font:900 22px/1 var(--display);color:var(--ink-3)">&rarr;</span>
        </a>`).join('')
      : '<div class="empty">No categories yet.</div>';
  }).catch(e => {
    document.getElementById('fr-cats').innerHTML = '<div class="empty">Forum offline (' + esc(e.message) + ').</div>';
  });
})();
</script>
</body>
</html>

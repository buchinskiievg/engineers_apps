<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Forum &mdash; IECCalc.com</title>
<meta name="description" content="Engineering forum — cables, faults, grounding, transformers, motors, power quality, standards." />
<link rel="stylesheet" href="/_lib/design.css?v=metal10" />
<link rel="stylesheet" href="/_lib/mobile.css" />
<style>
  html, body { height: 100%; } body { background: var(--paper); }
  .fr-pane { padding: 24px 32px 60px; }
  @media (max-width:760px) { .fr-pane { padding: 18px 16px; } }
  .fr-pane h1 { font: 900 28px/1 var(--display); letter-spacing: -0.02em; margin: 0 0 8px; text-transform: uppercase; }
  .fr-pane .lede { font: 500 13.5px/1.5 var(--sans); color: var(--ink-2); margin: 0 0 22px; max-width: 700px; }
  .fr-cat { display: grid; grid-template-columns: 44px 1fr auto auto; gap: 16px; align-items: center; padding: 14px 18px; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--ink); text-decoration: none; color: var(--ink); margin-bottom: 8px; transition: border-left-color .12s, background .12s; }
  .fr-cat:hover { background: #f0ede4; border-left-color: var(--red); }
  .fr-cat .icn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: var(--ink); color: var(--red); }
  .fr-cat h3 { margin: 0 0 3px; font: 900 15px/1.1 var(--display); text-transform: uppercase; }
  .fr-cat p { margin: 0; font: 500 12px/1.4 var(--sans); color: var(--ink-3); }
  .fr-cat .stat-k { font: 900 18px/1 var(--display); color: var(--red); display: block; text-align: center; }
  .fr-cat .stat-u { font: 800 9px/1 var(--sans); letter-spacing: 0.14em; color: var(--ink-3); margin-top: 2px; display: block; text-align: center; }

  .va-sidebar.fr-sidebar .va-sb-head { background: var(--paper); }
  .fr-tree { list-style: none; padding: 0; margin: 0; }
  .fr-tree-cat { display: flex; align-items: center; gap: 8px; padding: 9px 14px; text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--line); font: 700 12px/1.2 var(--sans); transition: background .1s; }
  .fr-tree-cat:hover { background: var(--paper); }
  .fr-tree-cat.is-on { background: var(--ink); color: var(--paper); }
  .fr-tree-cat .icn { width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; color: var(--red); flex-shrink: 0; }
  .fr-tree-cat .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.03em; }
  .fr-tree-cat .count { font: 800 10px/1 var(--display); color: var(--ink-3); background: var(--paper-2); padding: 3px 6px; flex-shrink: 0; }
  .fr-tree-cat.is-on .count { background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.85); }
</style>
</head>
<body>

<div class="va-app">
<aside class="va-sidebar fr-sidebar">
  <div class="va-sb-head">
    <span class="eyebrow-red">/ FORUM</span>
    <a class="va-sb-add" href="/account/?intent=signin" title="Start a thread">+</a>
  </div>
  <div class="va-sb-body">
    <ul class="fr-tree" id="fr-tree">
      <li style="padding:14px;color:var(--ink-3);font-size:12px">Loading&hellip;</li>
    </ul>
  </div>
  <div class="va-sb-foot">
    <span class="eyebrow">8 CATEGORIES &middot; SIGN IN TO POST</span>
  </div>
</aside>

<div class="va-app-main">
  <div class="fr-pane">
    <h1>Forum</h1>
    <p class="lede">Eight engineering categories. Pick from the left tree or any card below.</p>
    <div id="fr-cats"><p style="color:var(--ink-3);font-size:13px">Loading&hellip;</p></div>
  </div>
</div>
</div>

<script src="/_lib/api.js?v=projects2"></script>
<script src="/_lib/chrome.js"></script>
<script src="/_lib/auth-ui.js"></script>
<script>
(function() {
  'use strict';
  function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
  const ICONS = {
    bolt:  '<path d="M13 2 L4 14 H11 L9 22 L20 9 H13 L15 2 Z" fill="currentColor"/>',
    cable: '<path fill="none" stroke="currentColor" stroke-width="2" d="M3 9 q 4.5 -6 9 0 t 9 0"/><path fill="none" stroke="currentColor" stroke-width="2" d="M3 16 q 4.5 -6 9 0 t 9 0"/>',
    earth: '<path fill="none" stroke="currentColor" stroke-width="2" d="M12 2 V14 M5 14 H19 M7 17 H17 M9 20 H15"/>',
    tx:    '<circle cx="9" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="15" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/>',
    motor: '<circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" d="M9 9 L15 15 M15 9 L9 15"/>',
    cap:   '<path fill="none" stroke="currentColor" stroke-width="2" d="M3 12 H10 M14 12 H21 M10 5 V19 M14 5 V19"/>',
    doc:   '<path fill="none" stroke="currentColor" stroke-width="2" d="M5 3 H14 L19 8 V21 H5 Z M14 3 V8 H19 M8 12 H16 M8 15 H16 M8 18 H13"/>',
    book:  '<path fill="none" stroke="currentColor" stroke-width="2" d="M3 3 H11 a 2 2 0 0 1 2 2 V21 a 2 2 0 0 0 -2 -2 H3 Z M21 3 H13 a 2 2 0 0 0 -2 2 V21 a 2 2 0 0 1 2 -2 H21 Z"/>',
  };
  function icon(k, sz) { sz = sz || 18; return `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[k] || ICONS.book}</svg>`; }
  const curSlug = (location.pathname.match(/\/forum\/c\/([\w-]+)/) || [])[1] || null;

  IecApi.forumCategories().then(d => {
    const cats = d.categories || [];
    const tree = document.getElementById('fr-tree');
    tree.innerHTML = cats.map(c =>
      `<li><a href="/forum/c/${esc(c.slug)}" class="fr-tree-cat${curSlug === c.slug ? ' is-on' : ''}">`
      + `<span class="icn">${icon(c.icon, 16)}</span>`
      + `<span class="name">${esc(c.name)}</span>`
      + `<span class="count">${c.thread_count || 0}</span>`
      + `</a></li>`
    ).join('');
    const catsRoot = document.getElementById('fr-cats');
    if (catsRoot) {
      catsRoot.innerHTML = cats.map(c =>
        `<a href="/forum/c/${esc(c.slug)}" class="fr-cat">`
        + `<span class="icn">${icon(c.icon, 20)}</span>`
        + `<div><h3>${esc(c.name)}</h3><p>${esc(c.description || '')}</p></div>`
        + `<div><span class="stat-k">${c.thread_count || 0}</span><span class="stat-u">THREADS</span></div>`
        + `<span style="font:900 22px/1 var(--display);color:var(--ink-3)">&rarr;</span>`
        + `</a>`
      ).join('');
    }
  }).catch(e => {
    document.getElementById('fr-tree').innerHTML = '<li style="padding:14px;color:var(--ink-3);font-size:12px">Forum offline ('+esc(e.message)+')</li>';
    const r = document.getElementById('fr-cats'); if (r) r.innerHTML = '<p style="color:var(--ink-3);font-size:13px">Offline.</p>';
  });
})();
</script>
</body>
</html>

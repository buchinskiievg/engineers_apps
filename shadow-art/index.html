<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Shadow Art</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101114;color:#fff;font-family:Arial,sans-serif}*{box-sizing:border-box}#c{position:absolute;left:0;top:0;width:100%;height:100%}#stat{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;background:#000c;border:1px solid #555;border-radius:12px;padding:10px;z-index:4}.bar{position:absolute;z-index:5;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));display:table;width:calc(100% - 16px);border-spacing:5px}.bar b{display:table-cell;text-align:center;background:#292b30;border:1px solid #555;border-radius:14px;padding:15px 3px;font-weight:normal}.bar b.auto{background:#17633e}.panel{display:none;position:absolute;z-index:9;left:8px;right:8px;bottom:calc(78px + env(safe-area-inset-bottom));background:#1d1f23;border:1px solid #555;border-radius:16px;padding:12px;max-height:65%;overflow:auto}.panel.on{display:block}button,select,input{font-size:16px;background:#303238;color:#fff;border:1px solid #666;border-radius:10px;padding:10px;margin:4px}button{min-height:44px}.row{display:flex;flex-wrap:wrap}.row button{flex:1 0 29%}label{display:block;margin:9px 0}.close{float:right}.green{background:#17633e}</style></head>
<body onload="boot()"><canvas id="c"></canvas><div id="stat">JS: ожидание…</div>
<div id="objects" class="panel"><button class="close" onclick="hidePanels()">×</button><b>Добавить мусор</b><div class="row"><button onclick="add('bottle')">Бутылка</button><button onclick="add('can')">Банка</button><button onclick="add('box')">Коробка</button><button onclick="add('bag')">Пакет</button><button onclick="add('cup')">Стакан</button><button onclick="add('stick')">Палочка</button></div><button onclick="removeSelected()">Удалить выбранный</button></div>
<div id="auto" class="panel"><button class="close" onclick="hidePanels()">×</button><b>Auto Compose</b><label>Силуэт <select id="target"><option value="tree">Дерево</option><option value="fish">Рыба</option><option value="earth">Планета</option><option value="leaf">Лист</option></select></label><label>Предметов <input id="count" type="range" min="10" max="40" value="24"></label><button class="green" onclick="compose();hidePanels()">Собрать новый вариант</button></div>
<div id="light" class="panel"><button class="close" onclick="hidePanels()">×</button><b>Свет</b><label>X <input id="lx" type="range" min="-200" max="200" value="-100" oninput="readLight()"></label><label>Высота <input id="ly" type="range" min="80" max="500" value="340" oninput="readLight()"></label><label>Увеличение тени <input id="lm" type="range" min="60" max="180" value="110" oninput="readLight()"></label></div>
<div class="bar"><b onclick="showPanel('objects')">♻️<br>Объекты</b><b class="auto" onclick="showPanel('auto')">✨<br>Auto</b><b onclick="cycleMode()">↔️<br><span id="mode">Move</span></b><b onclick="showPanel('light')">💡<br>Свет</b></div>
<script>
var canvas,ctx,W,H,items=[],selected=-1,mode=0,drag=0,lastX=0,lastY=0,seed=1234,lightX=-100,lightY=340,lightM=1.1;
function R(){seed=(seed*9301+49297)%233280;return seed/233280}
function boot(){try{canvas=document.getElementById('c');ctx=canvas.getContext('2d');if(!ctx){document.getElementById('stat').innerHTML='Canvas не поддерживается';return}window.onresize=resize;resize();canvas.ontouchstart=touchStart;canvas.ontouchmove=touchMove;canvas.ontouchend=touchEnd;canvas.onmousedown=mouseDown;canvas.onmousemove=mouseMove;canvas.onmouseup=mouseUp;compose();document.getElementById('stat').innerHTML='JS OK · объектов: '+items.length}catch(e){document.getElementById('stat').innerHTML='ERR '+e.message}}
function resize(){W=window.innerWidth;H=window.innerHeight;canvas.width=W;canvas.height=H;draw()}
function showPanel(id){hidePanels();document.getElementById(id).className='panel on'}
function hidePanels(){document.getElementById('objects').className='panel';document.getElementById('auto').className='panel';document.getElementById('light').className='panel'}
function readLight(){lightX=parseInt(document.getElementById('lx').value,10);lightY=parseInt(document.getElementById('ly').value,10);lightM=parseInt(document.getElementById('lm').value,10)/100;draw()}
function add(t){items.push({t:t,x:R()*150-75,y:20+R()*100,z:20+R()*80,r:R()*6.28,s:.7+R()*.6});selected=items.length-1;hidePanels();update();draw()}
function removeSelected(){if(selected>=0){items.splice(selected,1);selected=-1;update();draw()}}
function update(){document.getElementById('stat').innerHTML='JS OK · объектов: '+items.length}
function shape(o,x,y,k,col){ctx.save();ctx.translate(x,y);ctx.rotate(o.r);ctx.scale(o.s*k,o.s*k);ctx.fillStyle=col;ctx.strokeStyle=col;ctx.lineWidth=6;ctx.lineCap='round';if(o.t=='bottle'){ctx.fillRect(-8,-24,16,40);ctx.fillRect(-4,-34,8,12)}else if(o.t=='can'){ctx.beginPath();ctx.arc(0,0,14,0,6.29);ctx.fill()}else if(o.t=='box'){ctx.fillRect(-18,-15,36,30)}else if(o.t=='bag'){ctx.beginPath();ctx.moveTo(-18,-15);ctx.lineTo(16,-20);ctx.lineTo(14,20);ctx.lineTo(-16,18);ctx.closePath();ctx.fill()}else if(o.t=='cup'){ctx.beginPath();ctx.moveTo(-14,-18);ctx.lineTo(14,-18);ctx.lineTo(9,18);ctx.lineTo(-9,18);ctx.fill()}else{ctx.fillRect(-27,-4,54,8)}ctx.restore()}
function sx(o){return W*.30+o.x}function sy(o){return H*.78-o.y-o.z*.18}
function draw(){if(!ctx)return;ctx.fillStyle='#111318';ctx.fillRect(0,0,W,H);var wx=W*.57,wy=H*.09,ww=W*.39,wh=H*.64;ctx.fillStyle='#ded8ca';ctx.fillRect(wx,wy,ww,wh);ctx.fillStyle='#28251f';ctx.fillRect(0,H*.78,W,H*.22);ctx.save();ctx.beginPath();ctx.rect(wx,wy,ww,wh);ctx.clip();var i,o,k,x,y;for(i=0;i<items.length;i++){o=items[i];k=(1.4+o.z/220)*lightM;x=wx+ww*.5+(o.x-lightX*.25)*k;y=wy+wh*.70-(o.y+(o.z-lightY*.12)*.22)*k;shape(o,x,y,k*.72,'rgba(20,20,20,.72)')}ctx.restore();for(i=0;i<items.length;i++){o=items[i];shape(o,sx(o),sy(o),1,['#657b70','#7b6954','#5d7180','#756278'][i%4]);if(i==selected){ctx.strokeStyle='#63e09b';ctx.beginPath();ctx.arc(sx(o),sy(o),28,0,6.29);ctx.stroke()}}ctx.fillStyle='#ffd86b';ctx.beginPath();ctx.arc(W*.17+lightX*.22,H*.78-lightY*.4,7,0,6.29);ctx.fill()}
function compose(){items=[];seed=(seed+317)%230000;var t=document.getElementById('target').value,n=parseInt(document.getElementById('count').value,10),i,a,u,x,y,r,types=['bottle','can','box','bag','cup','stick'];for(i=0;i<n;i++){a=R()*6.283;if(t=='tree'){if(i<n*.28){x=(R()-.5)*22;y=R()*115;r=1.57}else{x=Math.cos(a)*(30+R()*48);y=80+Math.sin(a)*(25+R()*38);r=a}}else if(t=='fish'){if(i<n*.78){x=Math.cos(a)*(28+R()*62);y=55+Math.sin(a)*(18+R()*30);r=a}else{x=-75-R()*35;y=55+(R()-.5)*65;r=(R()-.5)}}else if(t=='earth'){u=25+R()*62;x=Math.cos(a)*u;y=70+Math.sin(a)*u;r=a}else{u=R()*2-1;x=u*85;y=55+(1-Math.abs(u))*58+(R()-.5)*18;r=-u*.8}items.push({t:types[Math.floor(R()*types.length)],x:x,y:y,z:20+R()*75,r:r,s:.55+R()*.65})}selected=-1;update();draw()}
function cycleMode(){mode=(mode+1)%3;document.getElementById('mode').innerHTML=mode==0?'Move':mode==1?'Rotate':'Scale'}
function pick(x,y){var i,dx,dy,b=-1,d=999999;for(i=0;i<items.length;i++){dx=sx(items[i])-x;dy=sy(items[i])-y;if(dx*dx+dy*dy<d&&dx*dx+dy*dy<3600){d=dx*dx+dy*dy;b=i}}selected=b;update();draw();return b>=0}
function start(x,y){drag=pick(x,y)?1:0;lastX=x;lastY=y}
function move(x,y){if(!drag||selected<0)return;var dx=x-lastX,dy=y-lastY,o=items[selected];if(mode==0){o.x+=dx;o.y-=dy}else if(mode==1){o.r+=dx*.02}else{o.s+=dx*.008;if(o.s<.25)o.s=.25;if(o.s>3)o.s=3}lastX=x;lastY=y;draw()}
function touchStart(e){if(e.touches.length){start(e.touches[0].clientX,e.touches[0].clientY);e.preventDefault()}}function touchMove(e){if(e.touches.length){move(e.touches[0].clientX,e.touches[0].clientY);e.preventDefault()}}function touchEnd(e){drag=0}
function mouseDown(e){start(e.clientX,e.clientY)}function mouseMove(e){move(e.clientX,e.clientY)}function mouseUp(e){drag=0}
</script></body></html>
